name: Aevia PR checks
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    name: PR merge checks
    outputs:
      change_summary: ${{ steps.change_summary.outputs.value }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - run: npm ci
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no -- commitlint
      - name: Verify push checks for current head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: node scripts/ci-await-push.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:doctor
        env:
          AEVIA_TEST_BROWSER: chromium
          AEVIA_TEST_JSON: '1'
      - run: npm run test:pr
        env:
          AEVIA_TEST_BROWSER: chromium
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: HEAD
          AEVIA_CHANGE_SUMMARY_OUTPUT: ${{ runner.temp }}/change-obligations-pr.md
          AEVIA_CHANGE_SUMMARY_LINE_OUTPUT: ${{ runner.temp }}/change-obligations-pr-summary.txt
      - name: Publish change test obligations summary
        id: change_summary
        if: always()
        shell: bash
        run: |
          if [ -f "${{ runner.temp }}/change-obligations-pr.md" ]; then
            cat "${{ runner.temp }}/change-obligations-pr.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          summary="inconclusive"
          if [ -f "${{ runner.temp }}/change-obligations-pr-summary.txt" ]; then
            summary="$(tr -d '\r\n' < "${{ runner.temp }}/change-obligations-pr-summary.txt")"
          fi
          echo "value=${summary:-inconclusive}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aevia-pr-evidence
          path: tests/reports/summary/runs/
          if-no-files-found: warn
          retention-days: 14

  change_tests_summary:
    if: always()
    needs: checks
    name: Aevia change tests / ${{ needs.checks.outputs.change_summary || 'inconclusive' }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "PR change test summary is recorded in the job name."
