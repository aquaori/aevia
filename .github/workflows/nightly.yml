name: Aevia nightly lab
run-name: Aevia nightly / ${{ inputs.ci_hub_request_id || github.run_number }}
# Fixed Windows host for performance; Linux quality and race run independently.
on:
  schedule:
    - cron: "0 18 * * *" # 02:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      ci_hub_request_id:
        description: Optional CI hub request ID
        required: false
        type: string
      ci_hub_expected_sha:
        description: Commit confirmed in CI hub
        required: false
        type: string

permissions:
  contents: read

jobs:
  nightly:
    if: github.ref == 'refs/heads/main' && vars.AEVIA_PERF_RUNNER_READY == 'true'
    name: nightly / Windows performance / ${{ matrix.browser }}
    runs-on: [self-hosted, windows, aevia-nightly]
    outputs:
      performance_verdict: ${{ steps.qualification.outputs.verdict }}
    concurrency:
      group: aevia-nightly-performance
      cancel-in-progress: false
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - name: Check CI hub commit
        if: github.event_name == 'workflow_dispatch' && inputs.ci_hub_request_id != ''
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.ci_hub_expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$EXPECTED_SHA" = "$ACTUAL_SHA" ]
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: tests/reports/lab-history
          key: windows-aevia-lab-history-${{ github.run_id }}
          restore-keys: windows-aevia-lab-history-
      - name: Install browser engines
        run: npx playwright install chromium
      - name: Check test environment
        run: npm run test:doctor
        env:
          AEVIA_TEST_BROWSER: ${{ matrix.browser }}
          AEVIA_TEST_JSON: "1"
      - name: Select current report pointer
        shell: pwsh
        run: '"AEVIA_CI_RUN_ID_FILE=$env:RUNNER_TEMP/aevia-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.id" >> $env:GITHUB_ENV'
      - name: Run managed nightly suite
        run: npm run test:nightly -- --lane=performance
        env:
          AEVIA_TEST_BROWSER: ${{ matrix.browser }}
          AEVIA_EXTERNAL_GITHUB_SUMMARY: "off"
      - name: Publish performance qualification
        id: qualification
        if: always()
        run: node scripts/ci-performance-verdict.mjs
      - uses: actions/upload-artifact@v4
        id: report_artifact
        if: always()
        with:
          name: aevia-nightly-evidence-${{ matrix.browser }}
          path: tests/reports/summary/runs/
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize detailed performance report
        if: always()
        run: node scripts/ci-nightly-summary.mjs
        env:
          AEVIA_CI_ARTIFACT_URL: ${{ steps.report_artifact.outputs.artifact-url }}

  hosted_performance:
    if: vars.AEVIA_PERF_RUNNER_READY != 'true'
    name: nightly / Linux performance observation
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      AEVIA_LAB_DIAGNOSTIC: "1"
      AEVIA_TEST_BROWSER: chromium
      AEVIA_EXTERNAL_GITHUB_SUMMARY: "off"
    steps:
      - name: Check CI hub commit
        if: github.event_name == 'workflow_dispatch' && inputs.ci_hub_request_id != ''
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.ci_hub_expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$EXPECTED_SHA" = "$ACTUAL_SHA" ]
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Select current report pointer
        run: echo "AEVIA_CI_RUN_ID_FILE=$RUNNER_TEMP/aevia-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.id" >> "$GITHUB_ENV"
      - name: Run full performance observation
        run: npm run test:nightly -- --lane=performance --live=off
      - uses: actions/upload-artifact@v4
        id: report_artifact
        if: always()
        with:
          name: aevia-nightly-performance-observation
          path: tests/reports/summary/runs/
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize detailed performance report
        if: always()
        run: node scripts/ci-nightly-summary.mjs
        env:
          AEVIA_CI_ARTIFACT_URL: ${{ steps.report_artifact.outputs.artifact-url }}

  performance_qualification:
    if: always() && github.ref == 'refs/heads/main'
    needs: nightly
    name: Aevia performance qualification / ${{ needs.nightly.outputs.performance_verdict || 'inconclusive' }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Performance qualification is recorded in the job name."

  quality:
    name: nightly / Linux correctness and race
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check CI hub commit
        if: github.event_name == 'workflow_dispatch' && inputs.ci_hub_request_id != ''
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.ci_hub_expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$EXPECTED_SHA" = "$ACTUAL_SHA" ]
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:nightly -- --lane=quality --live=off
        env:
          AEVIA_TEST_BROWSER: chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aevia-linux-nightly-evidence
          path: tests/reports/summary/runs/
          if-no-files-found: warn
          retention-days: 30
